
name: Build TOOLZO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          flutter create --project-name toolzo --org com.toolzo --platforms android .

      - name: Put App Code in Correct Folder
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOOLZO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
